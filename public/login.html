<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Book System - Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Welcome to SmartBook</h1>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')" id="tabLogin">Login</button>
        <button class="auth-tab" onclick="switchTab('register')" id="tabRegister">Register</button>
      </div>

      <div id="alertContainer"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regName">Name</label>
          <input type="text" id="regName" class="form-control" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" class="form-control" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn btn-success btn-block">Create Account</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>Smart Book System &copy; 2026</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
