<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Book System - Reader</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div id="alertContainer"></div>

    <!-- Reader Header -->
    <div class="card">
      <div class="card-header">
        <div>
          <h1 class="card-title" id="readerTitle">Loading...</h1>
          <p style="color: var(--text-light);" id="readerAuthor"></p>
        </div>
        <a href="/member.html" class="btn btn-outline">← Back to My Account</a>
      </div>
    </div>

    <!-- Book Content -->
    <div class="card">
      <div id="readerContent">
        <div class="loading">Loading book content...</div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Smart Book System &copy; 2026</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/reader.js"></script>
</body>
</html>
