version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Update these with your actual MongoDB Atlas credentials
      - MONGO_URI=mongodb+srv://<user>:<password>@cluster0.xxxxx.mongodb.net/smart_book_system
      - JWT_SECRET=<your-secret>
      - JWT_EXPIRES_IN=30d
    restart: always